<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyhledávač</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/style.css" />
</head>

<body>
    <div class="container">
        <header class="main-header">
            <h1>Vyhledávač</h1>
        </header>
        
        <form onsubmit="event.preventDefault();search()" class="search-form">
            <div class="input-group">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>

                <input type="text" name="q" id="query" placeholder="Zadejte hledaný výraz, např. testování softwaru..." required>
            </div>
            <button type="submit" class="btn-primary" id="search-btn">
                <span>Vyhledat</span>
            </button>
        </form>

        <div class="results">
            <div class="header">
                <h2>Výsledky vyhledávání</h2>
                <a class="btn-secondary" id="download" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /><path d="M7 11l5 5l5 -5" /><path d="M12 4l0 12" /></svg>

                    Stáhnout JSON
                </a>
            </div>
            <div class="content" id="results-content">
                <div class="empty-state">
                    Zatím zde nejsou žádné výsledky. Zadejte dotaz výše.
                </div>
            </div>
        </div>
    </div>

    <script src="/public/script.js" defer></script>
</body>

</html>
